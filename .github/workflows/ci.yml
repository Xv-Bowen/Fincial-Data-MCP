name: Check source
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: node scripts/audit-release.mjs
      - run: pnpm typecheck
      - run: node scripts/test-mcp-oauth.mjs
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install pandas==3.0.6 requests==2.34.2
      - run: python -m unittest discover -s python-backend -p test_daily.py
